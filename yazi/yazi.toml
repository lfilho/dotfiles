# yazi.toml — general settings.
# Full option reference: https://yazi-rs.github.io/docs/configuration/yazi
#
# Mirrors the settings this replaces from ranger/rc.conf:
#   column_ratios, hidden_filter/show_hidden, vcs_aware (-> git.yazi plugin
#   below), sort*, preview_images/preview_images_method (native), mouse_enabled.
# Ranger's `use_preview_script`/scope.sh is gone entirely: image, video, pdf,
# archive, and syntax-highlighted text previews are all built into Yazi core.

[mgr]
ratio        = [1, 3, 4]
sort_by      = "natural"
sort_sensitive  = false
sort_reverse    = false
sort_dir_first  = true
show_hidden     = true
show_symlink    = true
mouse_events    = ["click", "scroll", "drag"]

[preview]
image_filter  = "lanczos3"
image_quality = 80

# Git status signs in the file list (see init.lua for the `git` plugin setup).
[[plugin.prepend_fetchers]]
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
url   = "*/"
run   = "git"
group = "git"
