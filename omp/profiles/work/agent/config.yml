setupVersion: 3
startup:
  checkUpdate: true
  changelogMode: expanded
modelRoles:
  smol: anthropic/claude-haiku-4-5
  slow: anthropic/claude-opus-5.5:max
  plan: anthropic/claude-opus-5.5:high
  vision: anthropic/claude-sonnet-5
  commit: lm-studio/qwen2.5-7b-instruct-1m
  tiny: lm-studio/qwen3-4b-instruct-2507
  task: anthropic/claude-sonnet-5
  advisor: anthropic/claude-haiku-4-5:medium
  web: anthropic/claude-haiku-4-5
  default: anthropic/claude-sonnet-5-5
retry:
  fallbackChains:
    commit:
      - anthropic/claude-sonnet-5
    tiny:
      - anthropic/claude-haiku-4-5
    web:
      - google-gemini-cli/gemini-2.5-flash
      - google-antigravity/gemini-2.5-flash
      - google/gemini-2.5-flash
      - openai-codex/gpt-5.6-luna
      - web/parallel
      - web/hosted
      - web/exa
      - web/firecrawl
      - web/searxng
      - web/startpage
      - web/duckduckgo
      - web/ecosia
      - web/google
      - web/mojeek
      - web/public
enabledModels:
  - anthropic/*
  - ollama/*
  - llama.cpp/*
  - lm-studio/*
defaultThinkingLevel: auto
composer:
  shape: box
theme:
  dark: dark-catppuccin
symbolPreset: nerd
tui:
  textSizing: true
  vimMode: true
  vimModeDisplay: icon
task:
  showResolvedModelBadge: true
  prewalk: true
statusLine:
  preset: custom
  leftSegments:
    - vim
    - model
    - mode
    - path
    - git
    - pr
  rightSegments:
    - session_name
    - context_pct
    - cost
  separator: powerline-thin
  showHookStatus: true
  segmentOptions:
    model:
      showThinkingLevel: true
    path:
      abbreviate: true
      maxLength: 40
      stripWorkPrefix: true
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
  sessionAccent: true
  transparent: true
terminal:
  showProgress: true
display:
  shimmer: classic
  showTokenUsage: true
  cacheMissMarker: true
  showTurnTime: true
omitThinking: true
textVerbosity: low
tier:
  anthropic: none
personality: pragmatic
steeringMode: one-at-a-time
read:
  renderMarkdown: true
  toolResultPreview: true
github:
  enabled: true
security:
  enabled: true
tools:
  approvalMode: yolo
browser:
  relay: true
prewalk:
  enabled: true
update:
  auto: false