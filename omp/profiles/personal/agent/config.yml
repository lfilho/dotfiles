setupVersion: 2
startup:
  checkUpdate: true
  changelogMode: expanded
modelRoles:
  default: opencode-go/gpt-5.6-luna
  smol: opencode-go/deepseek-v4.1-flash:auto
  slow: opencode-go/glm-5.3:max
  plan: opencode-go/glm-5.3:high
  vision: opencode-go/deepseek-v4-flash-vision-exp
  commit: lm-studio/qwen2.5-7b-instruct-1m
  tiny: opencode-go/deepseek-v4.1-flash:auto
  task: opencode-go/glm-5.3-flash
  advisor: opencode-go/glm-5:auto
  web: web/public
retry:
  fallbackChains:
    commit:
      - opencode-go/glm-5.3-flash
    tiny:
      - opencode-go/glm-5.3-flash
    web:
      - web/perplexity
      - google/gemini-2.5-flash
      - anthropic/claude-haiku-4-5
      - openai-codex/gpt-5.6-luna
      - xai/grok-4.5
      - web/zai
      - web/exa
      - web/tinyfish
      - web/jina
      - web/kagi
      - web/tavily
      - web/firecrawl
      - web/brave
      - web/kimi
      - web/parallel
      - web/synthetic
      - web/searxng
      - web/startpage
      - web/duckduckgo
      - web/ecosia
      - web/google
      - web/mojeek
      - google-antigravity/gemini-2.5-flash
      - openai-codex/gpt-5.6
      - openai-codex/gpt-5.5
      - xai-oauth/grok-4.5
      - web/ollama
enabledModels:
  - opencode-go/*
  - ollama/*
  - llama.cpp/*
  - lm-studio/*
defaultThinkingLevel: auto
composer:
  shape: box
theme:
  dark: dark-catppuccin
symbolPreset: nerd
tui:
  textSizing: true
  vimMode: true
  vimModeDisplay: icon
task:
  showResolvedModelBadge: true
statusLine:
  preset: custom
  leftSegments:
    - vim
    - model
    - mode
    - path
    - git
    - pr
  rightSegments:
    - session_name
    - context_pct
    - cost
  separator: powerline-thin
  showHookStatus: true
  segmentOptions:
    model:
      showThinkingLevel: true
    path:
      abbreviate: true
      maxLength: 40
      stripWorkPrefix: true
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
  sessionAccent: true
  transparent: true
terminal:
  showProgress: true
display:
  shimmer: classic
  showTokenUsage: true
  cacheMissMarker: true
  showTurnTime: true
omitThinking: true
textVerbosity: low
tier:
  anthropic: none
personality: pragmatic
steeringMode: one-at-a-time
read:
  renderMarkdown: true
  toolResultPreview: true
github:
  enabled: true
security:
  enabled: true
tools:
  approvalMode: yolo