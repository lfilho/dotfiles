setupVersion: 2
startup:
  checkUpdate: true
  changelogMode: expanded
modelRoles:
  default: opencode-go/kimi-k2.7-code
  smol: opencode-go/qwen3.8-flash
  slow: opencode-go/kimi-k3:max
  plan: opencode-go/kimi-k3:high
  vision: opencode-go/deepseek-v4-flash-vision-exp
  commit: lm-studio/qwen2.5-7b-instruct-1m
  tiny: lm-studio/qwen3-4b-instruct-2507
  task: opencode-go/kimi-k2.7-code
  advisor: opencode-go/qwen3.8-flash:medium
retry:
  fallbackChains:
    commit:
      - opencode-go/kimi-k2.7-code
    tiny:
      - opencode-go/qwen3.8-flash
enabledModels:
  - opencode-go/*
  - ollama/*
  - llama.cpp/*
  - lm-studio/*
defaultThinkingLevel: auto
composer:
  shape: box
theme:
  dark: dark-catppuccin
symbolPreset: nerd
tui:
  textSizing: true
task:
  showResolvedModelBadge: true
statusLine:
  preset: custom
  leftSegments:
    - model
    - mode
    - path
    - git
    - pr
  rightSegments:
    - session_name
    - context_pct
    - cost
  separator: powerline-thin
  showHookStatus: true
  segmentOptions:
    model:
      showThinkingLevel: true
    path:
      abbreviate: true
      maxLength: 40
      stripWorkPrefix: true
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
  sessionAccent: true
  transparent: true
terminal:
  showProgress: true
display:
  shimmer: classic
  showTokenUsage: true
  cacheMissMarker: true
omitThinking: true
textVerbosity: low
tier:
  anthropic: none
personality: pragmatic
steeringMode: one-at-a-time
read:
  renderMarkdown: true
  toolResultPreview: true
github:
  enabled: true
security:
  enabled: true
tools:
  approvalMode: yolo
providers:
  webSearchOrder:
    - public
    - perplexity
    - gemini
    - anthropic
    - codex
    - xai
    - zai
    - exa
    - tinyfish
    - jina
    - kagi
    - tavily
    - firecrawl
    - brave
    - kimi
    - parallel
    - synthetic
    - searxng
    - startpage
    - duckduckgo
    - ecosia
    - google
    - mojeek

